<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>CareBridge SG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&display=swap">
<style>
/* Layout: the poster itself. A flat indigo canvas, with content on off-white rounded "boards"; inside them, cream cards with
   indigo number discs, lavender caption strips, a blue title bar with a white icon, month tags. One look, no dark variant (poster is one look).
   Human help is the poster's coin yellow and nothing else uses it. */
:root{
  color-scheme:light;
  --canvas:#4446BF; --canvas-2:#3B3DB0; --canvas-line:rgba(255,255,255,.22);
  --board:#F5F5FC; --card:#FFFEFA; --line:#E0E1F2; --line-2:#CFD1EE;
  --ink:#1B1F4E; --muted:#4B5180;
  --indigo:#2A2EA3; --brand:#3B3FC2; --brand-deep:#2A2EA3; --brand-ink:#FFFFFF;
  --lav:#E2E1FF; --lav-2:#ECEDFF; --lav-ink:#262A95;
  --teal:#0D8C77; --teal-2:#14A38B; --teal-soft:#D2F2EB;
  --purple:#6A4FD9; --purple-soft:#E8E2FF;
  --sun:#F5B83D; --sun-ink:#2A1C00; --sun-soft:#FFF4DA; --sun-line:#E8C46E;
  --good:#1A6C44; --good-soft:#E0F3E8; --warn:#8A5000; --warn-soft:#FFEFD0; --alert:#A8221B; --alert-soft:#FBE6E4;
  --white:#FFFFFF; --white-2:rgba(255,255,255,.84);
  --bg:var(--board); --surface:var(--card);
  --scrim:rgba(18,18,60,.55); --focus:#F5B83D;
  --f:'Poppins','Noto Sans SC','Noto Sans Tamil',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:28px; --hs:1;
}
html{font-size:112.5%}
html[data-size="2"]{font-size:131.25%}
html[data-size="3"]{font-size:150%}
html[lang="ta"]{--hs:.82}
body{background:var(--canvas);color:var(--ink);font-family:var(--f);font-size:1rem;line-height:1.62;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
*{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--f);line-height:1.25;text-wrap:balance;margin:0;font-weight:700;color:var(--indigo)}
h1{font-size:calc(1.85rem*var(--hs))}
h2{font-size:calc(1.35rem*var(--hs))}
h3{font-size:calc(1.08rem*var(--hs))}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px;border-radius:8px}
.ic{width:1.5em;height:1.5em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--canvas)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--canvas);border-bottom:1px solid var(--canvas-line)}
.top-in{max-width:76rem;margin:0 auto;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;cursor:pointer;color:var(--white);font-weight:700;font-size:1.2rem}
.brand svg{width:2.3rem;height:2.3rem}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.tbtn{display:inline-flex;align-items:center;gap:6px;min-height:2.8rem;padding:0 14px;border-radius:999px;border:2px solid rgba(255,255,255,.5);background:transparent;color:var(--white);font-weight:600;cursor:pointer}
.tbtn:hover{background:rgba(255,255,255,.1)}
.size{display:flex;align-items:center;gap:2px;border-radius:999px;border:2px solid rgba(255,255,255,.5);padding:2px}
.size button{min-width:2.4rem;height:2.4rem;border-radius:999px;border:0;background:none;color:var(--white);cursor:pointer;font-weight:700}
.size button[data-arg="1"]{font-size:.82rem}.size button[data-arg="2"]{font-size:1rem}.size button[data-arg="3"]{font-size:1.22rem}
.size button[aria-pressed="true"]{background:var(--white);color:var(--indigo)}

/* page */
#app{display:flex;flex-direction:column;gap:22px;padding-block:22px 9rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app:focus{outline:none}
h1:focus{outline:none}
.wrap{width:100%;max-width:50rem;margin:0 auto;background:var(--board);border-radius:var(--r-xl);padding:24px;display:flex;flex-direction:column;gap:24px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.lead{font-size:1.08rem;color:var(--muted)}
.label{font-weight:600;color:var(--brand);font-size:.92rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:3.5rem;padding:.65rem 1.35rem;border-radius:var(--r-sm);border:2px solid transparent;font-weight:600;font-size:1rem;cursor:pointer;text-align:center;line-height:1.25}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand-deep)}
.btn-human{background:var(--sun);color:var(--sun-ink)}
.btn-human:hover{background:#EAAA2B}
.btn-quiet{background:var(--card);color:var(--indigo);border-color:var(--line-2)}
.btn-quiet:hover{border-color:var(--brand)}
.btn-white{background:var(--white);color:var(--indigo)}
.btn-white:hover{background:var(--lav-2)}
.btn-ghost{background:transparent;color:var(--white);border-color:rgba(255,255,255,.7)}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:3.1rem;padding:0 18px 0 10px;border-radius:999px;border:2px solid var(--line-2);background:var(--card);color:var(--indigo);font-weight:600;cursor:pointer}
.back:hover{border-color:var(--brand)}
.linkbtn{background:none;border:0;padding:8px 0;color:var(--brand);font-weight:600;text-decoration:underline;text-underline-offset:4px;cursor:pointer;text-align:left}

/* poster devices */
.num{width:2.3rem;height:2.3rem;border-radius:50%;background:var(--brand);color:var(--white);display:inline-grid;place-items:center;font-weight:700;font-size:1.05rem;flex:none;box-shadow:0 0 0 4px var(--lav)}
.disc{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--brand);color:var(--white);display:inline-grid;place-items:center;flex:none}
.disc .ic{width:1.35rem;height:1.35rem}
.disc.teal{background:var(--teal-2)}.disc.purple{background:var(--purple)}
.titlepill{display:inline-flex;align-items:center;gap:12px;padding:.5rem 1.4rem .5rem .9rem;border-radius:999px;background:var(--lav);border:2px solid #C9C8FA;color:var(--indigo);font-weight:700;font-size:calc(1.45rem*var(--hs));line-height:1.2}
.titlepill .ic{width:1.9rem;height:1.9rem;color:var(--brand)}
.pillhead{display:flex;align-items:center;gap:12px 22px;flex-wrap:wrap}
.pillhead p{flex:1 1 18rem;min-width:0;color:var(--indigo);font-weight:600;font-size:1.02rem;line-height:1.4}
.barhead{display:flex;align-items:center;gap:16px;padding:14px 20px;border-radius:var(--r-lg);background:var(--canvas);color:var(--white)}
.barhead > .ic{width:2.4rem;height:2.4rem}
.barhead h1,.barhead h2{color:var(--white)}
.barhead h1{font-size:calc(1.55rem*var(--hs))}
.barhead p{color:var(--white-2);font-size:.95rem}
.barhead > div{min-width:0}
.strip{background:var(--lav-2);color:var(--lav-ink);border-radius:var(--r-sm);padding:10px 14px;font-size:.88rem;font-weight:600;line-height:1.4}
.pic{display:block}
.pic svg{display:block;width:100%;height:100%}
.mini{width:6rem;height:4.1rem;flex:none;display:block}
.mini svg{display:block;width:100%;height:100%}

/* landing: hero */
.hero{width:100%;max-width:76rem;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1.1fr);gap:20px 28px;align-items:center;color:var(--white)}
.hero-txt{display:flex;flex-direction:column;gap:14px;min-width:0}
.langrow{display:flex;gap:8px;flex-wrap:wrap}
.lp{min-height:2.6rem;padding:0 14px;border-radius:999px;border:2px solid rgba(255,255,255,.45);background:transparent;color:var(--white);font-weight:600;cursor:pointer;font-family:var(--f);font-size:.9rem}
.lp[aria-pressed="true"]{background:var(--white);color:var(--indigo);border-color:var(--white)}
.bigbrand{display:flex;align-items:center;gap:16px}
.bigbrand svg{width:4.6rem;height:4.6rem;flex:none}
.bigbrand h1{color:var(--white);font-size:calc(2.7rem*var(--hs));font-weight:800;letter-spacing:-.01em;line-height:1.05}
.tagline{font-weight:700;font-size:calc(1.22rem*var(--hs));line-height:1.35}
.hero-lead{color:var(--white-2);max-width:32rem}
.hero-note{color:var(--white-2);font-size:.88rem}
.hero-art{align-self:end;min-width:0}
.hero-art svg{display:block;width:100%;height:auto}
.probcard{background:var(--white);color:var(--ink);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph-row{display:flex;align-items:center;gap:12px}
.alert-dot{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--brand);color:var(--white);display:grid;place-items:center;flex:none}
.alert-dot .ic{stroke-width:3}
.probcard > p{font-size:.95rem;color:var(--muted)}
.stmt{background:var(--lav-2);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:8px}
.stmt .ph-row .ic{color:var(--brand);width:1.9rem;height:1.9rem}
.stmt h3{font-size:1rem}
.stmt p{color:var(--indigo);font-weight:600;line-height:1.45}

/* landing: boards */
.board{width:100%;max-width:76rem;margin:0 auto;background:var(--board);border-radius:var(--r-xl);padding:24px;display:flex;flex-direction:column;gap:20px}
.features{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.feat-h{display:flex;align-items:flex-start;gap:12px}
.feat-h h3{font-size:calc(1rem*var(--hs));padding-top:.15rem}
.feat .pic{height:7rem}
.dots{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.9rem;line-height:1.45}
.dots li::marker{color:var(--brand)}
.feat .strip{margin-top:auto;text-align:center}
.motto{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.motto div{border-radius:var(--r-lg);padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.motto .dig{background:var(--lav);color:var(--indigo)}
.motto .hum{background:var(--sun);color:var(--sun-ink)}
.motto b{font-weight:700;font-size:calc(1.2rem*var(--hs));line-height:1.25}
.motto span{font-size:.92rem}
.plan{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:26px}
.plan li{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.plan li + li::before{content:"";position:absolute;left:-20px;top:50%;width:13px;height:13px;border-top:3px solid var(--brand);border-right:3px solid var(--brand);transform:translateY(-50%) rotate(45deg)}
.plan .ph-row{gap:8px}
.mtag{font-weight:700;font-size:.85rem;padding:3px 12px;border-radius:999px;background:var(--lav);color:var(--indigo);white-space:nowrap}
.mtag.teal{background:var(--teal-soft);color:#075A4C}.mtag.purple{background:var(--purple-soft);color:#45309E}
.plan h3{font-size:calc(.98rem*var(--hs))}
.plan p{font-size:.86rem;color:var(--muted);line-height:1.45}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.trio article{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.trio .lens{font-size:.82rem;font-weight:600;color:var(--muted)}
.trio p{font-size:.93rem}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 26px}
.how > div{display:flex;gap:12px;min-width:0}
.how h3{font-size:calc(1rem*var(--hs));margin-bottom:2px}
.how p{font-size:.9rem;color:var(--muted)}
.subhead{display:flex;align-items:center;gap:12px;padding-top:6px;border-top:1px solid var(--line)}
.subhead h2{padding-top:14px}

/* landing: impact */
.impact{width:100%;max-width:76rem;margin:0 auto;border:1.5px solid var(--canvas-line);background:var(--canvas-2);border-radius:var(--r-xl);padding:22px;display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr)) minmax(0,1.05fr);gap:18px;align-items:start;color:var(--white)}
.impact > .imp-title,.impact > .quote{align-self:center}
.imp-title{display:flex;align-items:center;gap:12px;padding-right:8px}
.imp-title .ic{width:2.6rem;height:2.6rem}
.imp-title h2{color:var(--white);font-size:calc(1.4rem*var(--hs))}
.imp-g{display:flex;gap:12px;align-items:flex-start;padding-left:18px;border-left:1.5px solid var(--canvas-line);min-width:0}
.imp-ic{width:3rem;height:3rem;border-radius:50%;background:var(--white);color:var(--brand);display:grid;place-items:center;flex:none}
.imp-g h3{color:var(--white);font-size:calc(1rem*var(--hs));margin-bottom:4px}
.imp-g ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:.86rem;color:var(--white-2);line-height:1.4}
.imp-g li{display:flex;gap:6px}
.imp-g li .ic{width:1.05em;height:1.05em;margin-top:.15em;stroke-width:2.6;color:var(--white)}
.quote{display:flex;gap:12px;align-items:center;background:var(--lav);color:var(--indigo);border-radius:var(--r-lg);padding:16px 18px;font-weight:700;line-height:1.35;font-size:calc(1rem*var(--hs))}
.quote .ic{color:var(--brand);width:2rem;height:2rem;fill:var(--brand)}
.canvas-foot{width:100%;max-width:76rem;margin:0 auto}
.foot{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted)}
.canvas-foot .foot{color:var(--white-2);border-color:var(--canvas-line)}

/* home */
.greet{width:100%;max-width:50rem;margin:0 auto;display:flex;flex-direction:column;gap:4px;color:var(--white)}
.greet h1{color:var(--white);font-size:calc(2.1rem*var(--hs));font-weight:800}
.greet .hi{color:var(--white-2)}
.greet p{color:var(--white-2);font-size:1.08rem}
.greet .chip{align-self:flex-start;margin-top:6px;background:rgba(255,255,255,.16);color:var(--white)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.84rem;font-weight:600;background:var(--lav);color:var(--lav-ink)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.alert{background:var(--alert-soft);color:var(--alert)}
.chip.sun{background:var(--sun-soft);color:var(--sun-ink)}
.today{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.today-row{display:flex;gap:14px;align-items:center;padding:14px 18px;flex-wrap:wrap}
.today-row + .today-row{border-top:1px solid var(--line)}
.today-row > div{flex:1 1 0;min-width:0}
.today-row > .btn{margin-left:auto}
.cards4{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hcard{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-lg);background:var(--card);border:2px solid var(--line);text-align:left;cursor:pointer;min-width:0;color:var(--ink)}
.hcard:hover{border-color:var(--brand)}
.hcard .feat-h h2{font-size:calc(1.15rem*var(--hs));padding-top:.2rem}
.hcard .pic{height:7.4rem}
.hcard p{color:var(--muted);font-size:.92rem}
.hcard .strip{margin-top:auto}
.banner{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:var(--r-md);background:var(--sun-soft);border:1px solid var(--sun-line);flex-wrap:wrap}
.banner > .ic{color:var(--sun-ink)}
.banner > div{flex:1 1 16rem;min-width:0}
.banner.info{background:var(--lav-2);border-color:var(--line-2)}
.banner.info > .ic{color:var(--brand)}

/* sections */
.section{display:flex;flex-direction:column;gap:14px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:12px}
.item{display:flex;gap:16px;align-items:flex-start;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);flex-wrap:wrap}
.item > .body{flex:1 1 14rem;min-width:0;display:flex;flex-direction:column;gap:4px}
.item h3{font-size:calc(1.05rem*var(--hs))}
.datebox{width:4.2rem;flex:none;text-align:center;border-radius:var(--r-sm);background:var(--brand);color:var(--white);padding:8px 4px;line-height:1.1}
.datebox b{display:block;font-size:1.55rem;font-weight:700}
.datebox span{font-size:.8rem;font-weight:600}
.docic{width:3rem;height:3rem;border-radius:50%;display:grid;place-items:center;background:var(--lav);color:var(--brand);flex:none}
.empty{padding:20px;border:2px dashed var(--line-2);border-radius:var(--r-md);color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600;min-width:0}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.why{background:var(--lav-2);border-radius:var(--r-md);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.why h4{font-size:1rem;display:flex;gap:8px;align-items:center}
.why ul{margin:0;padding-left:1.2em}
.ai{border:2px dashed #B9A9F2;background:var(--purple-soft);border-radius:var(--r-md);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.ai .tag{display:flex;align-items:center;gap:6px;color:#45309E;font-weight:600;font-size:.88rem}
.toggle{min-height:3rem;padding:0 16px;border-radius:999px;border:2px solid var(--line-2);background:var(--card);font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center;color:var(--indigo)}
.toggle[aria-pressed="true"]{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.suggest{border:2px solid var(--teal-2);background:var(--teal-soft)}
.suggest h3{color:#075A4C;display:flex;gap:8px;align-items:center}

/* step flows */
.progress{display:flex;flex-direction:column;gap:8px}
.bar{height:10px;background:var(--lav);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .3s}
.q{font-size:calc(1.6rem*var(--hs))}
.choices{display:flex;flex-direction:column;gap:12px}
.choice{display:flex;align-items:center;gap:14px;width:100%;min-height:4rem;padding:14px 18px;border-radius:var(--r-md);border:2px solid var(--line-2);background:var(--card);text-align:left;cursor:pointer;font-size:1.02rem;font-weight:600;color:var(--ink)}
.choice:hover{border-color:var(--brand)}
.choice small{display:block;font-weight:400;color:var(--muted);font-size:.88rem}
.choice .mark{width:1.7rem;height:1.7rem;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.choice.multi .mark{border-radius:7px}
.choice[aria-pressed="true"]{border-color:var(--brand);background:var(--lav-2)}
.choice[aria-pressed="true"] .mark{background:var(--brand);border-color:var(--brand);color:var(--white)}
.choice[aria-pressed="true"] .mark::after{content:"";width:.5rem;height:.85rem;border:solid currentColor;border-width:0 3px 3px 0;transform:translate(0,-2px) rotate(45deg)}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.flabel{font-weight:600;font-size:1.02rem}
.field .hint{font-size:.88rem;color:var(--muted)}
.input{min-height:3.5rem;padding:0 16px;border-radius:var(--r-sm);border:2px solid var(--line-2);background:var(--card);font-size:1.05rem;width:100%}
.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px var(--lav)}
.prefilled{background:var(--sun-soft);border-color:var(--sun-line)}
.prefill-tag{font-size:.85rem;display:flex;gap:6px;align-items:center;color:var(--muted);margin-top:-4px}
.err{color:var(--alert);font-weight:600}
.check{display:flex;gap:14px;align-items:flex-start;padding:16px;border:2px solid var(--line-2);border-radius:var(--r-md);background:var(--card);cursor:pointer}
.check input{width:1.8rem;height:1.8rem;flex:none;accent-color:var(--brand);margin-top:2px}
.check:has(input:checked){border-color:var(--brand);background:var(--lav-2)}
.stepfoot{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.helpme{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r-md);background:var(--sun-soft);border:1px dashed var(--sun-line)}
.helpme p{flex:1 1 12rem;font-size:.9rem;min-width:0}
.helpme .btn{min-height:3.1rem}
.singpass{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r-md);background:var(--lav-2)}
.result{border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:10px;border:2px solid}
.result.good{background:var(--good-soft);border-color:var(--good)}
.result.warn{background:var(--warn-soft);border-color:var(--warn)}
.result.alert{background:var(--alert-soft);border-color:var(--alert)}
.result h1{display:flex;gap:10px;align-items:center;font-size:calc(1.4rem*var(--hs));color:var(--ink)}
.spinner{width:3rem;height:3rem;border-radius:50%;border:5px solid var(--lav);border-top-color:var(--brand);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.scheme{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:12px}
.scheme-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.status{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.status li{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:12px}
.status li:last-child{padding-bottom:0}
.status li::before{content:"";position:absolute;left:.85rem;top:1.8rem;bottom:0;width:2px;background:var(--line-2)}
.status li:last-child::before{display:none}
.status .dot{width:1.8rem;height:1.8rem;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--line-2);background:var(--card);position:relative;z-index:1}
.status .dot .ic{width:1rem;height:1rem;stroke-width:3}
.status .done .dot{background:var(--brand);border-color:var(--brand);color:var(--white)}
.status .now .dot{border-color:var(--sun);background:var(--sun)}
.status .now{font-weight:600}
.status .todo{color:var(--muted)}

/* help button + sheets */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:12px;padding:10px 22px 10px 10px;border-radius:999px;border:3px solid var(--white);background:var(--sun);color:var(--sun-ink);font-size:1rem;line-height:1.2;text-align:left;cursor:pointer;box-shadow:0 8px 22px rgba(16,16,70,.35);max-width:calc(100vw - 32px)}
.fab .fi{width:3rem;height:3rem;border-radius:50%;background:var(--sun-ink);color:var(--sun);display:grid;place-items:center;flex:none}
.fab b{display:block;font-weight:700;font-size:1.08rem}
.layer{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:700px){.layer{align-items:center;padding:24px}}
.sheet{background:var(--board);width:100%;max-width:36rem;max-height:92vh;overflow:auto;border-radius:var(--r-xl) var(--r-xl) 0 0;padding-block:20px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;animation:rise .22s ease-out}
@media (min-width:700px){.sheet{border-radius:var(--r-xl)}}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{min-width:3.2rem;min-height:3.2rem;border-radius:50%;border:2px solid var(--line-2);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--indigo)}
.opt{display:flex;gap:16px;align-items:center;width:100%;padding:16px;border-radius:var(--r-md);border:2px solid var(--line-2);background:var(--card);cursor:pointer;text-align:left;color:var(--ink)}
.opt:hover{border-color:var(--sun-line)}
.opt .oi{width:3.3rem;height:3.3rem;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;flex:none}
.opt b{display:block;font-weight:700;font-size:calc(1.12rem*var(--hs));color:var(--indigo)}
.opt span span{color:var(--muted);font-size:.92rem}
.help-hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.help-hero .mini{width:8.5rem;height:5.8rem}
.help-hero p{flex:1 1 14rem;min-width:0;font-size:.93rem}
.bignum{font-size:2.5rem;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums;user-select:all;color:var(--indigo)}
.demo-label{display:inline-block;background:var(--alert-soft);color:var(--alert);font-weight:600;border-radius:8px;padding:2px 10px;font-size:.85rem}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{min-height:3.1rem;padding:0 18px;border-radius:999px;border:2px solid var(--line-2);background:var(--card);font-weight:600;cursor:pointer;color:var(--indigo)}
.pill[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--white)}
.langopt{font-size:1.15rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--white);padding:14px 20px;border-radius:var(--r-md);font-weight:600;width:max-content;max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center;box-shadow:0 8px 22px rgba(16,16,70,.3)}

@media (max-width:1180px){
  .hero{grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr)}
  .probcard{grid-column:1/-1}
  .features{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plan{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .plan li + li::before{display:none}
  .impact{grid-template-columns:repeat(3,minmax(0,1fr))}
  .imp-title,.quote{grid-column:1/-1}
  .imp-g:nth-child(2){border-left:0;padding-left:0}
}
@media (max-width:820px){
  .features,.trio,.how{grid-template-columns:repeat(2,minmax(0,1fr))}
  .impact{grid-template-columns:1fr}
  .imp-g{border-left:0;padding-left:0}
}
@media (max-width:640px){
  .hero{grid-template-columns:1fr}
  .hero-art{max-width:20rem;justify-self:center}
  .bigbrand svg{width:3.4rem;height:3.4rem}
  .bigbrand h1{font-size:calc(2.05rem*var(--hs))}
  .features,.trio,.how,.plan,.cards4,.motto{grid-template-columns:1fr}
  .wrap,.board{padding:18px;border-radius:var(--r-lg)}
  h1,.greet h1{font-size:calc(1.65rem*var(--hs))}
  .q{font-size:calc(1.4rem*var(--hs))}
  .titlepill{font-size:calc(1.2rem*var(--hs))}
  .tbtn .tl{display:none}
  .fab{padding:8px 16px 8px 8px}
  .fab .fi{width:2.6rem;height:2.6rem}
  .barhead{padding:12px 16px}
  .today-row > .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* character kit: every head is built from the same parts so they look like one family of drawings */
const _f=n=>+n.toFixed(1);
const _pts=(cx,cy,r,s,arr)=>arr.map(seg=>seg[0]+seg.slice(1).map(([x,y])=>`${_f(cx+s*x*r)} ${_f(cy+y*r)}`).join(' ')).join('');
const INK='#1F2160',HAIR='#1E2060',GREY='#ECEAF2',GREY2='#CFCBDD';
const SK={light:'#F2CDB3',mid:'#E9B48F',tan:'#C98E66'};
const SKN={light:'#E3B596',mid:'#D79E78',tan:'#B27A55'};
function hairBack(cx,cy,r,len,sk,neckTo,c=HAIR){const nk=sk?`<rect x="${_f(cx-.3*r)}" y="${_f(cy+.4*r)}" width="${_f(.6*r)}" height="${_f(neckTo-cy-.4*r)}" rx="${_f(.14*r)}" fill="${SKN[sk]}"/>`:'';const w=1.13*r,b=cy+len;return `<path d="M${_f(cx-w)} ${_f(cy)}C${_f(cx-w)} ${_f(cy-1.36*r)} ${_f(cx+w)} ${_f(cy-1.36*r)} ${_f(cx+w)} ${_f(cy)}C${_f(cx+w*1.04)} ${_f(cy+len*.55)} ${_f(cx+w*1.12)} ${_f(b-.3*r)} ${_f(cx+w*.8)} ${_f(b)}Q${_f(cx)} ${_f(b+.22*r)} ${_f(cx-w*.8)} ${_f(b)}C${_f(cx-w*1.12)} ${_f(b-.3*r)} ${_f(cx-w*1.04)} ${_f(cy+len*.55)} ${_f(cx-w)} ${_f(cy)}Z" fill="${c}"/>`+nk}
function fringe(cx,cy,r,side=1,c=HAIR){return `<path d="${_pts(cx,cy,r,side,[['M',[-1.08,.56]],['C',[-1.18,-.5],[-.75,-1.15],[0,-1.16]],['C',[.75,-1.16],[1.18,-.55],[1.08,.5]],['C',[1,.56],[.93,.47],[.9,.3]],['C',[.88,-.15],[.62,-.55],[.3,-.68]],['C',[-.12,-.62],[-.72,-.38],[-.86,.3]],['C',[-.88,.46],[-.96,.6],[-1.08,.56]],['Z']])}" fill="${c}"/><path d="${_pts(cx,cy,r,side,[['M',[.2,-.98]],['Q',[-.42,-.92],[-.7,-.52]]])}" fill="none" stroke="#33358A" stroke-width="${_f(Math.max(1.3,r*.07))}" stroke-linecap="round"/>`}
function cap(cx,cy,r,c=GREY,shade=GREY2){return `<path d="${_pts(cx,cy,r,1,[['M',[-1.06,.22]],['C',[-1.14,-.7],[-.62,-1.14],[0,-1.14]],['C',[.62,-1.14],[1.14,-.7],[1.06,.22]],['C',[1,.06],[.95,-.1],[.88,-.2]],['C',[.7,-.5],[.36,-.62],[.02,-.52]],['C',[-.34,-.62],[-.7,-.5],[-.88,-.2]],['C',[-.95,-.1],[-1,.06],[-1.06,.22]],['Z']])}" fill="${c}"/><path d="${_pts(cx,cy,r,1,[['M',[.04,-.58]],['Q',[.38,-.9],[.8,-.72]],['M',[-.04,-.58]],['Q',[-.38,-.9],[-.8,-.72]]])}" fill="none" stroke="${shade}" stroke-width="${_f(Math.max(1.3,r*.06))}" stroke-linecap="round"/>`}
function kidHair(cx,cy,r,c=HAIR){return `<path d="${_pts(cx,cy,r,1,[['M',[-1.05,.16]],['C',[-1.13,-.9],[-.5,-1.19],[0,-1.19]],['C',[.5,-1.19],[1.13,-.9],[1.05,.16]],['C',[.94,-.22],[.72,-.36],[.5,-.3]],['Q',[.26,-.54],[0,-.34]],['Q',[-.26,-.54],[-.5,-.3]],['C',[-.72,-.36],[-.94,-.22],[-1.05,.16]],['Z']])}" fill="${c}"/>`}
const bun=(cx,cy,r,c,shade)=>`<circle cx="${_f(cx)}" cy="${_f(cy-1.1*r)}" r="${_f(.44*r)}" fill="${c}"/><path d="M${_f(cx-.26*r)} ${_f(cy-1.02*r)}q${_f(.26*r)} ${_f(-.2*r)} ${_f(.52*r)} 0" fill="none" stroke="${shade}" stroke-width="${_f(Math.max(1.2,r*.05))}" stroke-linecap="round"/>`;
const ears=(cx,cy,r,sk)=>`<circle cx="${_f(cx-.98*r)}" cy="${_f(cy+.14*r)}" r="${_f(.2*r)}" fill="${SK[sk]}"/><circle cx="${_f(cx+.98*r)}" cy="${_f(cy+.14*r)}" r="${_f(.2*r)}" fill="${SK[sk]}"/>`;
const neck=(cx,cy,r,sk)=>`<rect x="${_f(cx-.3*r)}" y="${_f(cy+.7*r)}" width="${_f(.6*r)}" height="${_f(.62*r)}" rx="${_f(.12*r)}" fill="${SKN[sk]}"/>`;
const faceC=(cx,cy,r,sk)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${SK[sk]}"/>`;
function features(cx,cy,r,{closed=false,glasses=false,blush=true}={}){
  const e=_f(Math.max(1.5,.068*r)),ex=.35*r,ey=cy+.14*r,sw=_f(Math.max(1.6,.07*r));let s='';
  if(closed)s+=`<path d="M${_f(cx-ex-.13*r)} ${_f(ey)}q${_f(.13*r)} ${_f(-.13*r)} ${_f(.26*r)} 0M${_f(cx+ex-.13*r)} ${_f(ey)}q${_f(.13*r)} ${_f(-.13*r)} ${_f(.26*r)} 0" fill="none" stroke="${INK}" stroke-width="${sw}" stroke-linecap="round"/>`;
  else s+=`<circle cx="${_f(cx-ex)}" cy="${_f(ey)}" r="${e}" fill="${INK}"/><circle cx="${_f(cx+ex)}" cy="${_f(ey)}" r="${e}" fill="${INK}"/>`;
  if(glasses)s+=`<circle cx="${_f(cx-ex)}" cy="${_f(ey)}" r="${_f(.25*r)}" fill="none" stroke="${INK}" stroke-width="${sw}"/><circle cx="${_f(cx+ex)}" cy="${_f(ey)}" r="${_f(.25*r)}" fill="none" stroke="${INK}" stroke-width="${sw}"/><path d="M${_f(cx-ex+.25*r)} ${_f(ey)}h${_f(2*ex-.5*r)}" stroke="${INK}" stroke-width="${sw}"/>`;
  if(blush)s+=`<circle cx="${_f(cx-.6*r)}" cy="${_f(cy+.4*r)}" r="${_f(.15*r)}" fill="#E58A7A" opacity=".35"/><circle cx="${_f(cx+.6*r)}" cy="${_f(cy+.4*r)}" r="${_f(.15*r)}" fill="#E58A7A" opacity=".35"/>`;
  s+=`<path d="M${_f(cx-.2*r)} ${_f(cy+.44*r)}q${_f(.2*r)} ${_f(.17*r)} ${_f(.4*r)} 0" fill="none" stroke="${INK}" stroke-width="${sw}" stroke-linecap="round"/>`;
  return s}
/* whole heads (drawn after the body; long hair needs its back part drawn before the body via hairBack) */
const womanHead=(cx,cy,r,sk,side=1)=>faceC(cx,cy,r,sk)+fringe(cx,cy,r,side)+features(cx,cy,r);
const grannyHead=(cx,cy,r,sk,o={})=>bun(cx,cy,r,GREY,GREY2)+ears(cx,cy,r,sk)+faceC(cx,cy,r,sk)+cap(cx,cy,r)+features(cx,cy,r,o);
const kidHead=(cx,cy,r,sk)=>ears(cx,cy,r,sk)+faceC(cx,cy,r,sk)+kidHair(cx,cy,r)+features(cx,cy,r,{blush:true});
const bunHead=(cx,cy,r,sk)=>bun(cx,cy,r,HAIR,'#34367A')+ears(cx,cy,r,sk)+faceC(cx,cy,r,sk)+cap(cx,cy,r,HAIR,'#34367A')+features(cx,cy,r);

/* ---------- navigation ---------- */

function stepBack(){
  const v=S.view;
  if(v==='onboard'&&S.onbStep>0){S.onbStep--;S.onbErr='';return render()}
  if(v==='apptAdd'&&S.apptStep>0){S.apptStep--;S.apptErr='';return render()}
  if(v==='finCheck'&&S.finStep>0){S.finStep--;return render()}
  if(v==='finForm'&&S.ffStep>0&&!S.ffDone){S.ffStep--;S.ffErr='';return render()}
  if(v==='check'&&S.ck.i>0){S.ck.i--;return render()}
  if(v==='docAdd'&&S.doc.stage==='change'){S.doc.stage='result';return render()}
  if(v==='docAdd'&&S.doc.stage==='result'){S.doc={stage:'pick'};return render()}
  back()}

}

/* check-ins */
const CHECKS={senior:['eat','sleep','fall','mind','mood','daily'],carer:['tired','self','alone','money','work']};
VIEWS.check=()=>{
  const ck=S.ck,ks=CHECKS[ck.kind],s=sName();
  if(ck.i>=ks.length)return `<div class="wrap">${ck.kind==='senior'?seniorResult():carerResult()}</div>`;
  const k=ks[ck.i],sen=ck.kind==='senior';const opts=t((sen?'o_':'co_')+k,{s});
  return `<div class="wrap">${backBtn(ck.i===0?t('back'):t('prevQ'))}${progress(ck.i+1,ks.length)}
  <span class="label">${sen?t('ckSenior',{s}):t('ckCarer')}</span><h1 class="q">${t((sen?'q_':'cq_')+k,{s})}</h1>
  <div class="choices" role="group">${opts.map((o,n)=>`<button class="choice" data-act="ckAnswer" data-arg="${n}" aria-pressed="${ck.a[k]===n}"><span class="mark"></span><span>${o}</span></button>`).join('')}</div>
  <p class="muted small">${t('tapNext')}</p></div>`};
function seniorResult(){
  const a=S.ck.a,s=sName(),why=[],next=[];let score=0,medical=false;
  for(const k in a){score+=a[k];if(a[k])why.push(t('r_'+k+a[k],{s}))}
  if(a.fall===2||a.mind===2||a.eat===2)medical=true;
  const level=medical?'alert':score>=2?'warn':'good';const L2={good:'Good',warn:'Warn',alert:'Alert'}[level];
  if(medical||a.mind>=1)next.push(`<button class="btn btn-primary" data-act="bookDoctor">${ic('calendar')} ${t('nBook')}</button>`);
  if(a.fall>=1||a.daily>=1)next.push(`<button class="btn btn-quiet" data-act="go" data-arg="fin">${ic('wallet')} ${t('nFin')}</button>`);
  if(a.mood>=1)next.push(`<button class="btn btn-quiet" data-act="go" data-arg="acts">${ic('people')} ${t('nAct',{s})}</button>`);
  if(level!=='good')next.push(`<button class="btn btn-human" data-act="helpView" data-arg="callback">${ic('phone')} ${t('nTalk')}</button>`);
  S.ckResult={kind:'senior',level,label:'lbl_'+level};
  return `<span class="label">${t('ckSenior',{s})}</span>
  <div class="result ${level}"><h1>${ic(level==='good'?'check':'info')} ${t('res'+L2+'T')}</h1><p>${t('res'+L2+'D')}</p></div>
  ${why.length?`<div class="why"><h4>${ic('spark')} ${t('whyTitle')}</h4><p class="small">${t('rulesNote')}</p><ul>${why.map(w=>`<li>${w}</li>`).join('')}</ul>${medical?`<p class="small">${t('medNote',{s})}</p>`:''}</div>`:''}
  ${next.length?`<div class="stack">${next.join('')}</div>`:''}
  <p class="muted small">${t('emerg995',{s})}</p>
  <button class="btn btn-primary btn-block" data-act="saveCheck">${ic('check')} ${t('saveFinish')}</button>`}
function carerResult(){
  const a=S.ck.a,s=sName();let score=0;for(const k in a)score+=a[k];
  const level=score>=6?'alert':score>=3?'warn':'good';const out=[];
  if(a.tired>=1||a.self>=1)out.push(['break','meet','helpView']);
  if(a.alone>=1)out.push(['alone','acts','go']);
  if(a.money>=1)out.push(['money','fin','go']);
  if(a.work>=1)out.push(['work','callback','helpView']);
  S.ckResult={kind:'carer',level,label:'clbl_'+level};
  const T={good:['cGoodT','cGoodD'],warn:['cWarnT','cWarnD'],alert:['cAlertT','cWarnD']}[level];
  return `<span class="label">${t('ckCarer')}</span>
  <div class="result ${level}"><h1>${ic('heart')} ${t(T[0])}</h1><p>${t(T[1])}</p></div>
  ${out.map(([k,arg,act])=>`<div class="panel"><h3>${t('o_'+k)}</h3><p>${t('o_'+k+'D',{s})}</p><div><button class="btn btn-quiet" data-act="${act}" data-arg="${arg}">${t('o_'+k+'B')}</button></div></div>`).join('')}
  ${level==='alert'?`<div class="banner">${ic('phone')}<div><b>${t('sosT')}</b><p>${t('sosD')}</p></div><button class="btn btn-human" data-act="helpView" data-arg="callback">${t('reqCb')}</button></div>`:''}
  <button class="btn btn-primary btn-block" data-act="saveCheck">${ic('check')} ${t('saveFinish')}</button>`}

 {name:'Hospital discharge summary.pdf',text:'Discharge summary. Ward 7. Diagnosis: chest infection, treated. Medication: antibiotics for 5 more days. Please see your polyclinic doctor in 2 weeks.',sum:'sd0',appt:{type:'type_doc',days:14,place:'Westwood Polyclinic (example)'}},

function classify(text){const x=text.toLowerCase();let best='cat_other',hits=[];for(const c in DOC_CATS){const h=DOC_CATS[c].filter(w=>x.includes(w));if(h.length>hits.length){best=c;hits=h}}return {cat:best,hits,conf:'conf_'+Math.min(hits.length,3)}}

function matchSchemes(A){
  const s=sName(),out=[];const res=A.cit==='sc'||A.cit==='pr';const incOK=A.inc==='low'||A.inc==='mid',incNA=A.inc==='na';
  const incW=t(incNA?'w_incNA':'w_inc');const fell=S.checks.some(c=>c.fall);
  if(A.adl==='adl3'&&(incOK||incNA)&&res)out.push({id:'hcg',why:[t('w_adl3',{s}),incW,t(A.cit==='sc'?'w_sc':'w_pr',{s})]});
  if(A.age!=='u60'&&(incOK||incNA)&&A.cit==='sc'&&(A.adl!=='adl0'||fell))out.push({id:'smf',why:[t('w_60',{s}),A.adl!=='adl0'?t('w_adl1',{s}):t('w_fall'),incW]});
  if(A.age==='a65'||A.adl==='adl3')out.push({id:'ctg',why:[t(A.age==='a65'?'w_65':'w_bigHelp')]});
  if(A.adl==='adl3')out.push({id:'csl',why:[t('w_adl3',{s}),t('w_csl')]});
  if(A.born==='pg'&&A.cit==='sc')out.push({id:'pg',why:[t('w_pg',{s})]});
  if(A.born==='mg'&&A.cit==='sc')out.push({id:'mg',why:[t('w_mg',{s})]});
  if(A.inc==='low'&&res)out.push({id:'comcare',why:[t('w_low')]});
  return out}

  if(i===1){const pf=S.ffPrefill;const tag=pf?`<span class="prefill-tag">${ic('robot')} ${t('prefTag')}</span>`:'';const c=pf?'prefilled':'';
   q=t('ff1q');body=`${pf?`<p class="muted">${t('yellowNote')}</p>`:''}${field('ff.cname',t('fFull'),{cls:c})}${tag}${field('ff.rel',t('fRelL'),{cls:c})}${tag}${field('ff.sname',t('fSFull'),{cls:c})}${tag}${field('ff.phone',t('fPhone'),{type:'tel',mode:'tel',ph:t('phonePh'),hint:t('fPhoneHint')})}`}
  if(i===2){q=t('ff2q');body=`<div class="panel"><dl class="facts"><dt>${t('scheme')}</dt><dd>${esc(sc.name)}</dd><dt>${t('fFull')}</dt><dd>${esc(f.cname)}</dd><dt>${t('fRel')}</dt><dd>${esc(f.rel)}</dd><dt>${t('fSFull')}</dt><dd>${esc(f.sname)}</dd><dt>${t('mobile')}</dt><dd>${esc(f.phone)}</dd></dl></div>
   <div class="banner info">${ic('people')}<div><p>${t('ff2note',{a:sc.agency})}</p></div></div>`}
  return `<div class="wrap">${backBtn()}${progress(i+1,N)}<span class="label">${t('appL',{n:sc.name})}</span><h1 class="q">${q}</h1><div class="stack">${body}</div>${err?`<p class="err" role="alert">${err}</p>`:''}
  ${i>0?`<div class="stepfoot"><button class="btn btn-primary btn-block" data-act="ffNext">${i===N-1?t('sendCheck'):t('next')}</button></div>`:''}${helpMe(t('appL',{n:sc.name}))}</div>`};

/* activities & support */
const ACTS=[{id:'a1',p:'Sunbird Active Ageing Centre (example)',i:'leaf'},{id:'a2',p:'Sunbird Active Ageing Centre (example)',i:'chat'},{id:'a3',p:'Lakeview Community Club (example)',i:'people'},{id:'a4',p:'Banyan Community Centre (example)',i:'heart',carer:true}];
VIEWS.acts=()=>{const s=sName();const lastC=S.checks.filter(c=>c.kind==='carer').sort((a,b)=>b.date.localeCompare(a.date))[0];
 return `<div class="wrap">${backBtn()}${pageHead('people',t('actTitle'),t('c4d'))}
<section class="panel" style="background:var(--sun-soft);border:1px solid var(--sun-line)"><h2>${t('ywT')}</h2><p>${t('ywD')}</p>
  ${lastC?`<p class="small">${t('lastCk',{d:agoText(lastC.date)})} <span class="chip ${lastC.level}">${t(lastC.label)}</span></p>`:''}
  <div><button class="btn btn-primary" data-act="startCheck" data-arg="carer">${ic('heart')} ${t('ywBtn')}</button></div></section>
<section class="section"><div class="row">${pic('f4','mini')}<h2>${t('nearT')}</h2></div><p class="muted">${t('nearD',{s})}</p>
${ACTS.map(a=>{const on=S.interests.includes(a.id);return `<article class="item"><span class="docic">${ic(a.i)}</span><div class="body"><h3>${t(a.id+'t')}${a.carer?` <span class="chip sun">${t('forCarers')}</span>`:''}</h3><span>${t(a.id+'w')}</span><span class="muted">${ic('pin')} ${esc(a.p)}</span><p class="small">${t(a.id+'d')}</p><p class="small" style="color:var(--teal)">${ic('spark')} ${t('suitedFor',{w:t(a.id+'why')})}</p><div style="margin-top:6px"><button class="toggle" data-act="interest" data-arg="${a.id}" aria-pressed="${on}">${on?ic('check')+' '+t('noted'):t('interested')}</button></div></div></article>`}).join('')}</section>
<section class="panel"><h2>${t('respT')}</h2><p>${t('respD',{s})}</p><div><button class="btn btn-human" data-act="helpView" data-arg="meet">${ic('people')} ${t('respBtn')}</button></div></section>
<section class="panel"><h2>${t('famT')}</h2><p>${t('famD')}</p><p class="muted">${t('famD2',{s})}</p></section></div>`};

/* ---------- help panel ---------- */
const CENTRES=[{n:'Sunbird Active Ageing Centre',d:['walk',5]},{n:'Lakeview Community Club',d:['bus',10]},{n:'Banyan Community Centre',d:['bus',15]}];
function helpHTML(){
  const h=S.help,cb=S.forms.cb,m=S.forms.meet;
  const head=(ti,backTo)=>`<div class="sheet-head">${backTo?`<button class="back" data-act="helpView" data-arg="${backTo}">${ic('back')} ${t('back')}</button>`:'<span></span>'}<button class="x" data-act="closeHelp" aria-label="${t('close')}">${ic('close')}</button></div><h2 id="helpTitle">${ti}</h2>`;
  const topic=h.topic?`<div class="banner info"><p>${t('hpTopic',{t:h.topic})}</p></div>`:'';
  const err=S.cbErr?`<p class="err" role="alert">${S.cbErr}</p>`:'';
  const pills=(key,vals)=>`<div class="pills" role="group">${vals.map(v=>`<button class="pill" data-act="pickPill" data-key="${key}" data-arg="${v}" aria-pressed="${S.forms[key.split('.')[0]][key.split('.')[1]]===v}">${t(v)}</button>`).join('')}</div>`;
  if(h.view==='menu')return `${head(t('hpTitle'))}${topic}<div class="help-hero">${pic('f5','mini')}<p>${t('hpIntro')}</p></div>
   ${[['call','phone','opCall'],['callback','clock','opCb'],['meet','building','opMeet']].map(([v,i,k])=>`<button class="opt" data-act="helpView" data-arg="${v}"><span class="oi">${ic(i)}</span><span><b>${t(k)}</b><span>${t(k+'D')}</span></span></button>`).join('')}
   <p class="muted small">${t('noSignup')} ${t('emergency')}</p>`;
  if(h.view==='call')return `${head(t('callT'),'menu')}<p>${t('callIntro')}</p><p class="bignum">6000 0000</p><p><span class="demo-label">${t('demoNum')}</span></p><p class="muted">${t('hours')}</p>
   <div><button class="btn btn-quiet" data-act="copyNum">${t('copy')}</button></div><p class="muted small">${t('cantCall')} <button class="linkbtn" data-act="helpView" data-arg="callback">${t('askCall')}</button></p>`;
  if(h.view==='callback')return `${head(t('cbT'),'menu')}${topic}${field('cb.phone',t('phone'),{type:'tel',mode:'tel',ph:t('phonePh')})}
   <div class="field"><span class="flabel">${t('whichDay')}</span>${pills('cb.day',['todayD','tomorrow'])}</div>
   <div class="field"><span class="flabel">${t('whatTime')}</span>${pills('cb.time',['morningT','afternoonT','eveningT'])}</div>
   <div class="field"><span class="flabel">${t('prefLang')}</span><div class="pills" role="group">${LANGS.map(l=>`<button class="pill" lang="${l}" data-act="pickPill" data-key="cb.lang" data-arg="${l}" aria-pressed="${(cb.lang||lang)===l}">${L[l].langName}</button>`).join('')}</div></div>
   ${err}<button class="btn btn-human btn-block" data-act="sendCb">${ic('phone')} ${t('sendCbBtn')}</button>`;
  if(h.view==='meet')return `${head(t('meetT'),'menu')}${topic}<p>${t('meetIntro')}</p>
   <div class="choices" role="group">${CENTRES.map(c=>`<button class="choice" data-act="pickPill" data-key="meet.centre" data-arg="${c.n}" aria-pressed="${m.centre===c.n}"><span class="mark"></span><span>${c.n}<small>${t(c.d[0],{n:c.d[1]})}, ${t('exCentre')}</small></span></button>`).join('')}</div>
   <div class="field"><span class="flabel">${t('whenSuits')}</span>${pills('meet.slot',['wkM','wkA','satM'])}</div>
   ${field('meet.phone',t('phone'),{type:'tel',mode:'tel',ph:t('meetPhonePh')})}${err}
   <button class="btn btn-human btn-block" data-act="sendMeet">${ic('calendar')} ${t('sendMeetBtn')}</button>`;
  if(h.view==='done')return `${head(t(h.doneT))}<div class="result good"><p>${h.doneD}</p><p>${t('yourRef',{r:h.ref})}</p></div><p class="muted small">${t('protoNote')}</p><button class="btn btn-primary btn-block" data-act="closeHelp">${t('done')}</button>`;
}
function openHelp(view='menu',topic=null){if($('#helpLayer').hidden)S.lastFocus=document.activeElement;S.help={view,topic};S.cbErr='';renderHelp()}
function renderHelp(){const L2=$('#helpLayer');L2.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="helpTitle">${helpHTML()}</div>`;L2.hidden=false;document.body.style.overflow='hidden';const h=L2.querySelector('h2');h.tabIndex=-1;h.focus()}
function closeHelp(){$('#helpLayer').hidden=true;document.body.style.overflow='';S.lastFocus&&S.lastFocus.focus&&S.lastFocus.focus()}

/* sheets: language + confirm */
function openSheet(html){S.lastFocus2=document.activeElement;const l=$('#sheetLayer');l.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">${html}</div>`;l.hidden=false;l.querySelector('#shT').focus()}
function closeSheet(){$('#sheetLayer').hidden=true;S.lastFocus2&&S.lastFocus2.focus&&S.lastFocus2.focus()}
function openLang(){openSheet(`<div class="sheet-head"><span></span><button class="x" data-act="closeSheet" aria-label="${t('close')}">${ic('close')}</button></div><h2 id="shT" tabindex="-1">${ic('globe')} ${t('chooseLang')}</h2>
  <div class="choices" role="group">${LANGS.map(l=>`<button class="choice langopt" lang="${l}" data-act="setLang" data-arg="${l}" aria-pressed="${l===lang}"><span class="mark"></span><span>${L[l].langName}</span></button>`).join('')}</div>`)}
function confirmBox({title,body,yes,onYes}){S._onYes=onYes;openSheet(`<h2 id="shT" tabindex="-1">${title}</h2><p>${body}</p><div class="stack"><button class="btn btn-primary btn-block" data-act="cfYes">${yes}</button><button class="btn btn-quiet btn-block" data-act="closeSheet">${t('noBack')}</button></div>`)}
let toastT;function toast(msg){const el=$('#toast');el.innerHTML=ic('check')+' '+msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3600)}
function setLang(l){if(!L[l])return;lang=l;document.documentElement.lang=l;try{localStorage.setItem('cb-lang',l)}catch(e){}if(!$('#sheetLayer').hidden)closeSheet();render(true);if(!$('#helpLayer').hidden)renderHelp()}
function setSize(n){document.documentElement.dataset.size=n;document.querySelectorAll('[data-act=size]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.arg===String(n)));try{localStorage.setItem('cb-size',n)}catch(e){}}
const phoneOK=v=>/^[689]\d{7}$/.test((v||'').replace(/\s/g,''));
const fmtPhone=v=>{const p=v.replace(/\s/g,'');return p.slice(0,4)+' '+p.slice(4)};

/* ---------- actions ---------- */
const A={
 back:stepBack,goHome,brandHome:goHome,go:v=>go(v),size:n=>setSize(n),setLang,openLang,closeSheet,
 cfYes:()=>{$('#sheetLayer').hidden=true;const f=S._onYes;S._onYes=null;f&&f()},
 tryDemo:()=>{loadExample();S.stack=[];S.view='home';render();toast(t('exampleFamily'))},
 startOnb:()=>{S.onbStep=0;S.onbErr='';S.singpass=false;go('onboard')},
 singpass:()=>{Object.assign(S.forms.onb,{caregiver:'Tan Mei Ling',relation:'rel_daughter',senior:'Mdm Tan Siew Lan',age:'78'});S.singpass=true;render(true)},
 onbNext:()=>{
  const f=S.forms.onb,i=S.onbStep;S.onbErr='';
  if(i===0&&(!(f.caregiver||'').trim()||!f.relation))S.onbErr=t('errName');
  if(i===1){const age=parseInt(f.age,10);if(!(f.senior||'').trim())S.onbErr=t('errSenior');else if(!age||age<40||age>115)S.onbErr=t('errAge')}
  if(i===2&&!(f.prefs||[]).length)S.onbErr=t('errPrefs');
  if(i===3&&!f.tech)S.onbErr=t('errOne');
  if(i===4&&!f.consent)S.onbErr=t('errConsent');
  if(S.onbErr)return render(true);
  if(i<4){S.onbStep++;return render()}
  S.profile={caregiver:f.caregiver.trim(),relation:f.relation,senior:f.senior.trim(),short:f.senior.trim(),age:parseInt(f.age,10),prefs:f.prefs,tech:f.tech,consent:true,prefill:!!f.prefill};
  S.demo=false;S.appts=[];S.docs=[];S.checks=[];S.apps=[];S.stack=[];S.view='home';render();toast(t('welcome',{n:S.profile.caregiver}))},
 pick:(v,b)=>{const[f,k]=b.dataset.key.split('.');S.forms[f][k]=v;b.closest('[role=group]').querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed',x===b));
  if(S.view==='onboard'&&k==='tech'){render(true);return}
  if(b.dataset.auto)setTimeout(()=>A[b.dataset.auto](),260)},
 toggle:(v,b)=>{const[f,k]=b.dataset.key.split('.');const arr=S.forms[f][k]=S.forms[f][k]||[];const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);b.setAttribute('aria-pressed',i<0)},
 pickPill:(v,b)=>{const[f,k]=b.dataset.key.split('.');S.forms[f][k]=v;b.closest('[role=group]').querySelectorAll('[aria-pressed]').forEach(x=>x.setAttribute('aria-pressed',x===b))},
 openHelp:()=>openHelp('menu'),closeHelp,helpView:v=>openHelp(v,$('#helpLayer').hidden?null:S.help.topic),helpWith:x=>openHelp('menu',x),
 copyNum:()=>{const sel=()=>{const el=document.querySelector('.bignum');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast(t('selected'))};try{navigator.clipboard.writeText('6000 0000').then(()=>toast(t('copied')),sel)}catch(e){sel()}},
 sendCb:()=>{const c=S.forms.cb;if(!phoneOK(c.phone)){S.cbErr=t('errPhone');return renderHelp()}if(!c.day||!c.time){S.cbErr=t('errDayTime');return renderHelp()}
  S.help={...S.help,view:'done',ref:ref(),doneT:'cbDoneT',doneD:t('cbDoneD',{p:fmtPhone(c.phone),d:t(c.day),t:t(c.time)})+' '+L[c.lang||lang].langName+'.'};renderHelp()},
 sendMeet:()=>{const m=S.forms.meet;if(!m.centre||!m.slot){S.cbErr=t('errCentre');return renderHelp()}if(!phoneOK(m.phone)){S.cbErr=t('errPhone');return renderHelp()}
  S.help={...S.help,view:'done',ref:ref(),doneT:'meetDoneT',doneD:t('meetDoneD',{c:m.centre,p:fmtPhone(m.phone)})+' ('+t(m.slot)+')'};renderHelp()},
 startCheck:k=>{S.ck={kind:k,i:0,a:{}};go('check')},
 ckAnswer:(n,b)=>{const k=CHECKS[S.ck.kind][S.ck.i];S.ck.a[k]=+n;b.setAttribute('aria-pressed','true');setTimeout(()=>{S.ck.i++;render()},220)},
 saveCheck:()=>{const r=S.ckResult;S.checks.push({kind:r.kind,date:isoOffset(0),level:r.level,label:r.label,fall:r.kind==='senior'&&S.ck.a.fall>0});S.stack=['home'];S.view=r.kind==='senior'?'care':'acts';render();toast(t('ckSaved'))},
 bookDoctor:()=>{S.forms.appt={type:'type_doc',reminder:'rem_1d'};S.apptStep=1;S.apptErr='';go('apptAdd')},
 sugAdd:()=>{S.forms.appt={type:'type_spec',reminder:'rem_1d',place:'General Hospital, Eye Clinic (example)'};S.apptStep=1;S.apptErr='';S.sugPending=true;go('apptAdd')},
 newAppt:()=>{S.forms.appt={};S.apptStep=0;S.apptErr='';S.sugPending=false;go('apptAdd')},
 apptNext:()=>{const f=S.forms.appt,i=S.apptStep;S.apptErr='';
  if(i===0&&!f.type)S.apptErr=t('errType');
  if(i===1){if(!f.date||!f.time)S.apptErr=t('errWhen');else if(f.date<isoOffset(0))S.apptErr=t('errPast')}
  if(i===2&&!(f.place||'').trim())S.apptErr=t('errPlace');
  if(i===3&&!f.reminder)S.apptErr=t('errType');
  if(S.apptErr)return render(true);
  if(i<4){S.apptStep++;return render()}
  S.appts.push({id:Date.now(),type:f.type,date:f.date,time:f.time,place:f.place.trim(),reminder:f.reminder});if(S.sugPending)S.sugDone=true;
  S.view='appts';S.stack=['home'];render();toast(t('apptSaved'))},
 setPlace:p=>{S.forms.appt.place=p;render(true)},
 toggleRem:id=>{const a=S.appts.find(x=>x.id==id);a.reminder=a.reminder==='rem_none'?'rem_1d':'rem_none';render(true);toast(a.reminder==='rem_none'?t('remTurnedOff'):t('remTurnedOn'))},
 delAppt:id=>{const a=S.appts.find(x=>x.id==id);confirmBox({title:t('remConfirmT'),body:t('remConfirmD',{t:t(a.type),d:fmtDate(a.date)}),yes:t('yesRemove'),onYes:()=>{S.appts=S.appts.filter(x=>x.id!=id);render(true);toast(t('apptRemoved'))}})},
 newDoc:()=>{S.doc={stage:'pick'};go('docAdd')},
 docSample:n=>readDoc(SAMPLE_DOCS[n]),
 docChange:()=>{S.doc.stage='change';render()},
 docSetCat:c=>{S.doc.result.cat=c;S.doc.result.changed=true;S.doc.stage='result';render()},
 docSave:()=>{const d=S.doc;S.docs.unshift({id:Date.now(),name:d.doc.name,cat:d.result.cat,by:d.result.changed?'byYou':'byAI'});S.view='appts';S.stack=['home'];render();toast(t('savedIn',{c:t(d.result.cat)}))},
 docToAppt:()=>{const a=S.doc.doc.appt;S.forms.appt={type:a.type,date:isoOffset(a.days),time:'09:00',place:a.place,reminder:'rem_1d'};S.apptStep=4;S.apptErr='';S.sugPending=false;go('apptAdd');toast(t('filledFromDoc'))},
 startFin:()=>{S.forms.fin={};if(S.profile){const age=P().age;S.forms.fin.age=age>=65?'a65':age>=60?'a60':'u60';const by=new Date().getFullYear()-age;S.forms.fin.born=by<=1949?'pg':by<=1959?'mg':'later'}S.finStep=0;go('finCheck')},
 finNext:()=>{const q=FIN_Q[S.finStep];if(!S.forms.fin[q.k])return;if(S.finStep<FIN_Q.length-1){S.finStep++;render()}else{S.finAnswers={...S.forms.fin};S.explain={};S.stack=['home','fin'];S.view='finResults';render()}},
 explain:id=>{S.explain[id]=!S.explain[id];render(true)},
 prepForm:id=>{S.ffScheme=id;S.ffStep=0;S.ffDone=null;S.ffErr='';S.forms.ff={};go('finForm')},
 ffConsent:v=>{const p=P();S.ffPrefill=v==='yes';S.forms.ff=v==='yes'?{cname:p.caregiver,rel:t(p.relation),sname:p.senior}:{};S.ffStep=1;render()},
 ffNext:()=>{const f=S.forms.ff;S.ffErr='';
  if(S.ffStep===1){if(!f.cname||!f.rel||!f.sname)S.ffErr=t('errFill');else if(!phoneOK(f.phone))S.ffErr=t('errPhone');if(S.ffErr)return render(true);S.ffStep=2;return render()}
  confirmBox({title:t('cfSendT'),body:t('cfSendD'),yes:t('cfYesSend'),onYes:()=>{S.ffDone=ref();S.apps.unshift({id:Date.now(),scheme:S.ffScheme,ref:S.ffDone,stage:0});S.stack=['home','fin'];render()}})},
 interest:id=>{const i=S.interests.indexOf(id);if(i>=0){S.interests.splice(i,1);render(true);toast(t('removedToast'))}else{S.interests.push(id);render(true);toast(t('notedToast'))}}
};
function readDoc(doc){S.doc={stage:'reading',doc};render();setTimeout(()=>{S.doc.result=classify(doc.text);S.doc.stage='result';if(S.view==='docAdd')render()},1300)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b.dataset.arg,b,e)}});
document.addEventListener('input',e=>{const k=e.target.dataset.field;if(!k||e.target.type==='checkbox')return;const[f,x]=k.split('.');S.forms[f][x]=e.target.value});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.field&&el.type==='checkbox'){const[f,x]=el.dataset.field.split('.');S.forms[f][x]=el.checked}
  if(el.id==='docfile'&&el.files&&el.files[0]){const name=el.files[0].name;readDoc({name,text:name.replace(/[_\-.]+/g,' ')})}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#sheetLayer').hidden)closeSheet();else if(!$('#helpLayer').hidden)closeHelp()}});
$('#helpLayer').addEventListener('click',e=>{if(e.target.id==='helpLayer')closeHelp()});
$('#sheetLayer').addEventListener('click',e=>{if(e.target.id==='sheetLayer')closeSheet()});

let sz='1',lg='en';try{sz=localStorage.getItem('cb-size')||'1';lg=localStorage.getItem('cb-lang')||'en'}catch(e){}
setSize(sz);lang=L[lg]?lg:'en';document.documentElement.lang=lang;render();
</script>
